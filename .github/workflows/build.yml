name: Build File Categorizer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

env:
  APP_DIR: app
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.APP_DIR }}\requirements-dev.txt
          pip install pyinstaller

      - name: Build standalone EXE with PyInstaller
        run: |
          cd ${{ env.APP_DIR }}
          python -m PyInstaller FileCategorizer.spec --noconfirm --clean

      - name: Download VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe

      - name: Build Inno Setup installer
        run: |
          # Inno Setup is pre-installed on GitHub Windows runners
          $issPath = Join-Path ${env:APP_DIR} 'FileCategorizer.iss'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
        shell: pwsh

      - name: Rename installer to include version
        run: |
          $ver = git describe --tags --abbrev=0 | Replace-String '^v',''
          Rename-Item -Path '${env:APP_DIR}\dist\FileCategorizer-Setup-1.0.0.exe' -NewName "FileCategorizer-Setup-${ver}.exe" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCategorizer-Setup
          path: ${{ env.APP_DIR }}\dist\FileCategorizer-Setup-*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/dist/FileCategorizer-Setup-*.exe
          generate_release_notes: true