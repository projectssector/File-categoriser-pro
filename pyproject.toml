[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-categorizer"
version = "1.0.0"
description = "Local-first self-learning file categorizer for images and videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "google-generativeai>=0.5",
    "rich>=13.7",
    "typer>=0.12",
    "openpyxl>=3.1",
    "imagehash>=4.3",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pyinstaller>=6.5",
    "PySide6>=6.6",
]
build = ["pyinstaller>=6.5"]

[project.scripts]
file-categorizer = "file_categorizer.cli:app"

[project.gui-scripts]
file-categorizer-gui = "file_categorizer.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
